# Option rapide: Home Assistant OS publie directement dans un GitHub Gist public.
# C'est pratique pour demarrer sans serveur, mais ce n'est pas une vraie base
# de donnees temps reel. Pour un flux plus robuste, utiliser le Worker Cloudflare.
# Entity IDs valides retrouves dans l'inventaire HA du 2026-08-31.
#
# Secret a creer dans Home Assistant:
# github_gist_authorization: "Bearer TON_GITHUB_TOKEN_AVEC_PERMISSION_GISTS_WRITE"
#
# Le site lit ce Gist public:
# https://api.github.com/gists/073aeffc14e94afa3a516de6db8cd411

rest_command:
  publish_battery_gist:
    url: "https://api.github.com/gists/073aeffc14e94afa3a516de6db8cd411"
    method: PATCH
    headers:
      authorization: !secret github_gist_authorization
      accept: "application/vnd.github+json"
    content_type: "application/json; charset=utf-8"
    verify_ssl: true
    timeout: 15
    payload: >-
      {% set status = {
        "updatedAt": now().isoformat(),
        "gateway": "Home Assistant OS · Waveshare ESP32 Bluetooth",
        "batteries": [
          {
            "name": "BMS JBD · A",
            "model": "DP04S007L4S200A · LiFePO4 4S · 200 A",
            "connected": states("sensor.dp04s007l4s200a_batterie") not in ["unavailable", "unknown", "none"],
            "soc": states("sensor.dp04s007l4s200a_batterie") | float(0),
            "capacityAh": 280,
            "remainingAh": ((states("sensor.dp04s007l4s200a_batterie") | float(0)) * 280 / 100) | round(1),
            "voltage": states("sensor.dp04s007l4s200a_tension") | float(0),
            "current": states("sensor.dp04s007l4s200a_courant") | float(0),
            "power": states("sensor.dp04s007l4s200a_puissance") | float(0),
            "temperature": states("sensor.dp04s007l4s200a_temperature") | float(0),
            "energy": states("sensor.dp04s007l4s200a_energie_stockee") | float(0),
            "highestCell": states("sensor.dp04s007l4s200a_highest_cell_voltage") | float(0),
            "lowestCell": states("sensor.dp04s007l4s200a_lowest_cell_voltage") | float(0),
            "cellDelta": states("sensor.dp04s007l4s200a_delta_cell_voltage") | float(0),
            "cycles": states("sensor.dp04s007l4s200a_cycles") | int(0),
            "balancing": is_state("binary_sensor.dp04s007l4s200a_balancer", "on"),
            "chargingAllowed": is_state("binary_sensor.dp04s007l4s200a_charge_mosfet", "on"),
            "dischargingAllowed": is_state("binary_sensor.dp04s007l4s200a_discharge_mosfet", "on"),
            "alarm": is_state("binary_sensor.dp04s007l4s200a_probleme", "on")
          },
          {
            "name": "BMS JBD · B",
            "model": "DP04S007L4S200A · LiFePO4 4S · 200 A",
            "connected": states("sensor.dp04s007l4s200a_batterie_2") not in ["unavailable", "unknown", "none"],
            "soc": states("sensor.dp04s007l4s200a_batterie_2") | float(0),
            "capacityAh": 280,
            "remainingAh": ((states("sensor.dp04s007l4s200a_batterie_2") | float(0)) * 280 / 100) | round(1),
            "voltage": states("sensor.dp04s007l4s200a_tension_2") | float(0),
            "current": states("sensor.dp04s007l4s200a_courant_2") | float(0),
            "power": states("sensor.dp04s007l4s200a_puissance_2") | float(0),
            "temperature": states("sensor.dp04s007l4s200a_temperature_2") | float(0),
            "energy": states("sensor.dp04s007l4s200a_energie_stockee_2") | float(0),
            "highestCell": states("sensor.dp04s007l4s200a_highest_cell_voltage_2") | float(0),
            "lowestCell": states("sensor.dp04s007l4s200a_lowest_cell_voltage_2") | float(0),
            "cellDelta": states("sensor.dp04s007l4s200a_delta_cell_voltage_2") | float(0),
            "cycles": states("sensor.dp04s007l4s200a_cycles_2") | int(0),
            "balancing": is_state("binary_sensor.dp04s007l4s200a_balancer_2", "on"),
            "chargingAllowed": is_state("binary_sensor.dp04s007l4s200a_charge_mosfet_2", "on"),
            "dischargingAllowed": is_state("binary_sensor.dp04s007l4s200a_discharge_mosfet_2", "on"),
            "alarm": is_state("binary_sensor.dp04s007l4s200a_probleme_2", "on")
          }
        ]
      } %}
      {{ {
        "description": "Télémétrie publique batteries Ambulance Lab",
        "files": {
          "battery-status.json": {
            "content": status | to_json
          }
        }
      } | to_json }}

automation:
  - alias: "Ambulance - publier batteries dans GitHub Gist"
    id: ambulance_publish_batteries_to_github_gist
    mode: single
    initial_state: true
    triggers:
      - trigger: time_pattern
        minutes: "/2"
    actions:
      - action: rest_command.publish_battery_gist
